include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # 코드 생성 산출물은 린트 대상이 아니다.
    - "**/*.g.dart"
  errors:
    # 스캐폴드 단계에서 TODO는 정상 상태다.
    todo: ignore

linter:
  rules:
    # 하드코딩 색·치수를 막기 위한 최소 장치.
    # (완전한 방지는 코드리뷰 몫 — AppColors/AppDimens만 쓴다는 규칙.)
    prefer_const_constructors: true
    prefer_const_declarations: true
    always_declare_return_types: true
    avoid_print: true
    require_trailing_commas: true
